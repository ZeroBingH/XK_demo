<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1600" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.55" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1150 420) rotate(90) scale(420)">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 880) rotate(90) scale(380)">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1200" fill="url(#heroBg)"/>
  <rect width="1600" height="1200" fill="url(#glow)"/>
  <rect width="1600" height="1200" fill="url(#glow2)"/>

  <!-- 网格点阵 -->
  <g fill="#FFFFFF" opacity="0.06">
    <circle cx="120" cy="140" r="2"/><circle cx="320" cy="140" r="2"/><circle cx="520" cy="140" r="2"/><circle cx="720" cy="140" r="2"/><circle cx="920" cy="140" r="2"/><circle cx="1120" cy="140" r="2"/><circle cx="1320" cy="140" r="2"/><circle cx="1520" cy="140" r="2"/>
    <circle cx="120" cy="340" r="2"/><circle cx="320" cy="340" r="2"/><circle cx="520" cy="340" r="2"/><circle cx="720" cy="340" r="2"/><circle cx="920" cy="340" r="2"/><circle cx="1120" cy="340" r="2"/><circle cx="1320" cy="340" r="2"/><circle cx="1520" cy="340" r="2"/>
    <circle cx="120" cy="540" r="2"/><circle cx="320" cy="540" r="2"/><circle cx="520" cy="540" r="2"/><circle cx="720" cy="540" r="2"/><circle cx="920" cy="540" r="2"/><circle cx="1120" cy="540" r="2"/><circle cx="1320" cy="540" r="2"/><circle cx="1520" cy="540" r="2"/>
    <circle cx="120" cy="740" r="2"/><circle cx="320" cy="740" r="2"/><circle cx="520" cy="740" r="2"/><circle cx="720" cy="740" r="2"/><circle cx="920" cy="740" r="2"/><circle cx="1120" cy="740" r="2"/><circle cx="1320" cy="740" r="2"/><circle cx="1520" cy="740" r="2"/>
    <circle cx="120" cy="940" r="2"/><circle cx="320" cy="940" r="2"/><circle cx="520" cy="940" r="2"/><circle cx="720" cy="940" r="2"/><circle cx="920" cy="940" r="2"/><circle cx="1120" cy="940" r="2"/><circle cx="1320" cy="940" r="2"/><circle cx="1520" cy="940" r="2"/>
    <circle cx="120" cy="1140" r="2"/><circle cx="320" cy="1140" r="2"/><circle cx="520" cy="1140" r="2"/><circle cx="720" cy="1140" r="2"/><circle cx="920" cy="1140" r="2"/><circle cx="1120" cy="1140" r="2"/><circle cx="1320" cy="1140" r="2"/><circle cx="1520" cy="1140" r="2"/>
  </g>

  <!-- 心脏线稿 -->
  <g stroke="#60A5FA" stroke-opacity="0.85" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M800 760 C 640 660, 520 560, 520 440 C 520 350, 600 290, 690 290 C 745 290, 785 320, 800 350 C 815 320, 855 290, 910 290 C 1000 290, 1080 350, 1080 440 C 1080 560, 960 660, 800 760 Z"/>
    <path d="M800 350 C 790 420, 770 470, 720 505" stroke-opacity="0.5"/>
    <path d="M880 320 C 920 380, 940 430, 930 500" stroke-opacity="0.5"/>
  </g>
  <!-- 心电波形穿过心脏 -->
  <path d="M460 520 h90 l24 -58 32 116 26 -84 16 26 h84 l20 -44 28 88 22 -60 14 16 h180" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>

  <!-- 数据网络节点与连线 -->
  <g stroke="#3B82F6" stroke-opacity="0.45" stroke-width="1.5">
    <line x1="300" y1="260" x2="520" y2="420"/>
    <line x1="520" y1="420" x2="420" y2="640"/>
    <line x1="420" y1="640" x2="640" y2="820"/>
    <line x1="1080" y1="420" x2="1260" y2="300"/>
    <line x1="1080" y1="420" x2="1230" y2="600"/>
    <line x1="1230" y1="600" x2="1020" y2="790"/>
    <line x1="1020" y1="790" x2="640" y2="820"/>
    <line x1="1260" y1="300" x2="1420" y2="470"/>
    <line x1="1420" y1="470" x2="1230" y2="600"/>
    <line x1="300" y1="260" x2="200" y2="480"/>
    <line x1="200" y1="480" x2="420" y2="640"/>
  </g>
  <g>
    <circle cx="300" cy="260" r="7" fill="#60A5FA"><animate attributeName="opacity" values="0.4;0.85;0.4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="420" r="5" fill="#22D3EE"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="640" r="6" fill="#60A5FA"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="820" r="5" fill="#93C5FD"><animate attributeName="opacity" values="0.45;0.85;0.45" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="420" r="6" fill="#22D3EE"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="1260" cy="300" r="7" fill="#60A5FA"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="1230" cy="600" r="5" fill="#93C5FD"/>
    <circle cx="1020" cy="790" r="6" fill="#60A5FA"/>
    <circle cx="1420" cy="470" r="5" fill="#22D3EE"/>
    <circle cx="200" cy="480" r="5" fill="#93C5FD"/>
  </g>
</svg>
